version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender-compliance-api
    ports:
      - "8012:8012"
    volumes:
      - db-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TENDER_DB_PATH=/app/data/tender_compliance.db
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tender-net

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: tender-compliance-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tender-net
    profiles:
      - production

volumes:
  db-data:
    driver: local

networks:
  tender-net:
    driver: bridge
